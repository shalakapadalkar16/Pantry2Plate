# Reverse proxy in front of gunicorn.
#
# Two jobs: serve static files without waking a Python worker, and forward
# everything else. Gunicorn is an application server and serving static
# assets through it wastes a worker slot per request.

upstream django {
    # Compose DNS resolves the service name. Using a name rather than an IP
    # means a rebuilt container is picked up without editing this file.
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # The corpus import posts nothing large, but a JSON body of saved-recipe
    # notes could grow. 10MB is generous and stops a runaway request.
    client_max_body_size 10M;

    # Real client address for Django. Without these, every request appears
    # to come from the nginx container and ALLOWED_HOSTS checks see the
    # wrong Host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /var/www/static/;
        # Static assets are content-hashed by collectstatic, so a long
        # cache is safe: a changed file has a changed name.
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://django;
        proxy_redirect off;
        # Coverage search over 2M rows can be slow on a cold cache with no
        # Elasticsearch. 60s matches the gunicorn timeout so nginx does not
        # give up on a request the worker is still serving.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}